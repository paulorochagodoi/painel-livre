# Testes de unidade, lint e build debug a cada envio. O release (assinado) é feito só na máquina do
# dono, porque a chave de assinatura não fica no repositório.
name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de regressão JVM (sem carro ou emulador)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint e build debug
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: PainelLivre-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
